# Rime schema settings
# encoding: utf-8

schema:
  schema_id: bim-stroke
  name: "笔画"
  version: "0.5"
  author:
    - 四季的風
    - 雪齋
    - Kunki Chou
  description: |
    五筆畫
    h,s,p,n,z 代表橫、豎、撇、捺、折
  dependencies:

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 西文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
#    - reverse_lookup_translator
    - table_translator

speller:
  alphabet: "abcdefghijklmnopqrstuvwxyz"
  delimiter: " '"

menu:
  page_size: 9

translator:
  dictionary: bim-stroke
  contextual_suggestions: true #模型预测
  contextual_group_by_type: true
  max_homophones: 5
  max_homographs: 5
  preedit_format:
    - xlit/hspnz/⼀⼁⼃⼂ㄥ/   # 康熙部首（橫豎撇點折）
  comment_format:
    - xform/~//
    - xlit/hspnz/⼀⼁⼃⼂ㄥ/   # 康熙部首（橫豎撇點折）

grammar:
  language: wanxiang-lts-zh-hans
  collocation_max_length: 8 #命中的最长词组
  collocation_min_length: 2 #命中的最短词组,搭配词频健全的词库时候应当最小值设为3避开2字高频词
  collocation_penalty: -6 #默认-12 对常见搭配词组施加的惩罚值。较高的负值会降低这些搭配被选中的概率,防止过于频繁地出现某些固定搭配。
  non_collocation_penalty: -18 #默认-12 对非搭配词组施加的惩罚值。较高的负值会降低非搭配词组被选中的概率,避免不合逻辑或不常见的词组组合。
  weak_collocation_penalty: -24 #默认-24 对弱搭配词组施加的惩罚值。保持默认值通常是为了有效过滤掉不太常见但仍然合理的词组组合。
  rear_penalty: -18 #默认-18 对词组中后续词语的位置施加的惩罚值。较高的负值会降低某些词语在句子后部出现的概率,防止句子结构不自然。

abc_segmentor:
  extra_tags:
    - reverse_lookup

reverse_lookup:
  dictionary: luna_pinyin
  prefix: "`"
  suffix: "'"
  tips: 〔拼音〕
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/
  comment_format:
#   - xlit/hspnz/㇐㇑㇒㇏㇠/   # 中日韓筆畫（橫豎撇捺折）
    - xlit/hspnz/⼀⼁⼃⼂ㄥ/   # 康熙部首（橫豎撇點折）

punctuator:
  import_preset: default

key_binder:
  import_preset: default
  bindings:
    # 兼容其他筆畫名稱（捺屬點部、提屬橫部）
    - { when: always, accept: "d", send: "n" }
    - { when: always, accept: "t", send: "h" }
    # 兼容Mac筆畫輸入法按鍵：🅹⼀, 🅺⼁, 🅻⼃, 🆄⼂, 🅸⺂
    - { when: always, accept: "j", send: "h" }
    - { when: always, accept: "k", send: "s" }
    - { when: always, accept: "l", send: "p" }
    - { when: always, accept: "u", send: "n" }
    - { when: always, accept: "i", send: "z" }
    # 兼容Mac筆畫輸入法小鍵盤按鍵：1︎⃣⼀, 2︎⃣⼁, 3︎⃣⼃, 4︎⃣⼂, 5︎⃣⺂
    - { when: always, accept: "KP_1", send: "h" }
    - { when: always, accept: "KP_2", send: "s" }
    - { when: always, accept: "KP_3", send: "p" }
    - { when: always, accept: "KP_4", send: "n" }
    - { when: always, accept: "KP_5", send: "z" }
    # 禁用小鍵盤其他數字按鍵，以防誤觸
    - { when: has_menu, accept: "KP_6", send: Select }
    - { when: has_menu, accept: "KP_7", send: Select }
    - { when: has_menu, accept: "KP_8", send: Select }
    - { when: has_menu, accept: "KP_9", send: Select }
    - { when: has_menu, accept: "KP_0", send: Select }

recognizer:
  import_preset: default
  patterns:
    reverse_lookup: "`[a-z]*'?$"
